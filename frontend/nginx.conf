server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls are same-origin ("/api/..."). nginx forwards them to the API container over the
    # compose network, so the browser only ever talks to this one address — which is what makes
    # the app work through a public tunnel without a hard-coded backend host.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular does its own routing in the browser. A hard refresh on a deep link like
    # /campaigns/new must still return index.html rather than a 404, so the app can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
