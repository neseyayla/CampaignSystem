server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular does its own routing in the browser. A hard refresh on a deep link like
    # /campaigns/new must still return index.html rather than a 404, so the app can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
