server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls are same-origin ("/api/..."). nginx forwards them to the API container.
    #
    # The upstream host is resolved at request time (via Docker's embedded DNS at 127.0.0.11),
    # not when nginx starts. Resolving at startup would make nginx refuse to boot whenever the
    # api container is not up yet — which is exactly what happens on a fresh "compose up", where
    # this container starts before the API. The variable in proxy_pass is what defers it.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular does its own routing in the browser. A hard refresh on a deep link like
    # /campaigns/new must still return index.html rather than a 404, so the app can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
