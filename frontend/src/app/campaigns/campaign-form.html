<h1>New campaign</h1>

<form [formGroup]="form" (ngSubmit)="save()">
  <section>
    <h2>General</h2>

    <div class="grid">
      <label class="wide">
        <span>Campaign name</span>
        <input type="text" formControlName="name" maxlength="200" />
        @if (invalid('name')) {
          <small class="error">A name is required.</small>
        }
      </label>

      <label>
        <span>Campaign type</span>
        <select formControlName="campaignType">
          <option value="Mass">MASS — open to everyone</option>
          <option value="EnrollmentRequired">SI — enrollment required</option>
        </select>
      </label>

      <fieldset class="level">
        <legend>Level</legend>
        <label class="radio">
          <input type="radio" formControlName="earningType" value="CardBased" />
          Card based
        </label>
        <label class="radio">
          <input type="radio" formControlName="earningType" value="CustomerBased" />
          Customer based
        </label>
        <small>Card based pays each card separately; customer based pools them into one reward.</small>
      </fieldset>

      <label class="wide">
        <span>Description</span>
        <textarea formControlName="description" rows="2" maxlength="1000"></textarea>
      </label>

      <label>
        <span>Start date</span>
        <input type="date" formControlName="startDate" />
        @if (invalid('startDate')) {
          <small class="error">A start date is required.</small>
        }
      </label>

      <label>
        <span>End date</span>
        <input type="date" formControlName="endDate" />
        @if (invalid('endDate')) {
          <small class="error">An end date is required.</small>
        }
      </label>

      <label>
        <span>Points per qualifying transaction</span>
        <input type="number" formControlName="rewardPoint" min="0" step="0.01" />
      </label>

      <label>
        <span>Maximum reward</span>
        <input type="number" formControlName="maxRewardAmount" min="0" step="0.01" />
        <small>Applied per card on a card based campaign, per customer otherwise.</small>
      </label>
    </div>
  </section>

  <section>
    <h2>Card and customer criteria</h2>

    <div class="grid demographics">
      <label>
        <span>Gender</span>
        <select formControlName="gender">
          <option value="">All genders</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </label>

      <fieldset class="level">
        <legend>Card type</legend>
        <label class="radio">
          <input type="radio" formControlName="cardType" value="" />
          All
        </label>
        <label class="radio">
          <input type="radio" formControlName="cardType" value="Primary" />
          Primary cards
        </label>
        <label class="radio">
          <input type="radio" formControlName="cardType" value="Supplementary" />
          Supplementary cards
        </label>
      </fieldset>
    </div>

    <div class="pickers">
      <app-criteria-picker
        label="Customer group"
        [options]="segments()"
        [(selected)]="selectedSegments" />

      <app-criteria-picker
        label="Product code"
        [options]="products()"
        [(selected)]="selectedProducts" />
    </div>
  </section>

  <section>
    <h2>Transaction criteria</h2>

    <div class="pickers">
      <app-criteria-picker
        label="Transaction code"
        [options]="transactionCodes()"
        [(selected)]="selectedTransactionCodes" />

      <app-criteria-picker
        label="Merchant"
        [options]="merchants()"
        [(selected)]="selectedMerchants" />
    </div>

    <div class="grid amounts">
      <label>
        <span>Minimum amount</span>
        <input type="number" formControlName="minimumAmount" min="0" step="0.01" />
      </label>

      <label>
        <span>Maximum amount</span>
        <input type="number" formControlName="maximumAmount" min="0" step="0.01" />
      </label>
    </div>
  </section>

  @if (error()) {
    <p class="error banner">{{ error() }}</p>
  }

  <footer>
    <button type="button" class="secondary" (click)="cancel()" [disabled]="saving()">Cancel</button>
    <button type="submit" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Save campaign' }}</button>
  </footer>
</form>
