server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls are same-origin ("/api/..."). nginx forwards them to the API container.
    #
    # The upstream host is resolved at request time (via Docker's embedded DNS at 127.0.0.11),
    # not when nginx starts. Resolving at startup would make nginx refuse to boot whenever the
    # api container is not up yet — which is exactly what happens on a fresh "compose up", where
    # this container starts before the API. The variable in proxy_pass is what defers it.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: a hard refresh on a deep link (e.g. /kampanyalar/5) must return index.html
    # so Angular's router can take over, rather than nginx answering 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
