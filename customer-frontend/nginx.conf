server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls are same-origin ("/api/..."). nginx forwards them to the API container over the
    # compose network, so the browser only ever talks to this one address — which is what makes
    # the app work through a public tunnel without a hard-coded backend host.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: a hard refresh on a deep link (e.g. /kampanyalar/5) must return index.html
    # so Angular's router can take over, rather than nginx answering 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
