[project]
name = "campaignsystem-synthetic-data"
version = "0.1.0"
description = "Causal synthetic data generator for the CampaignSystem banking campaign platform"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "faker>=30.0",
    "matplotlib>=3.8",
]

# This is a runnable tool, not an installable library — uv should not try to build it.
[tool.uv]
package = false
